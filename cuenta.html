<head>

    <title>Cinepolis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Comic Sans Ms;
            background-color: white;
            color: #071026;
        }

        header {
            background-color: #0B1B3D;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #162A52;
        }

        header h1 {
            color: white;
        }

        nav {
            background-color: #0B1B3D;
            padding: 12px;
            border-bottom: 1px solid #162A52;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #A2B5D5;
        }

        main {
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        article {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .galeria-imagenes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .galeria-imagenes img {
            width: 120px;
            height: 180px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #0B1B3D;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            background-color: #162A52;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }

        select, input {
            padding: 8px;
            border-radius: 4px;
            border: none;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .submit {
            background-color: #0B1B3D;
            color: white;
        }

        .submit:hover {
            background-color: #071026;
        }

        .reset {
            background-color: #333333;
            color: white;
            border: 1px solid #555555;
        }

        footer {
            background-color: #050A18;
            padding: 15px;
            text-align: center;
            color: #A2B5D5;
            margin-top: 20px;
            border-top: 1px solid #162A52;
        }
    </style>
</head>
